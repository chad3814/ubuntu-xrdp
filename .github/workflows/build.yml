name: Build container images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag applied to the pushed images (e.g. v1.2.3)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chad3814/ubuntu-xrdp

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "26.04"
            dockerfile: Dockerfile
            latest: true
          - variant: "24.04"
            dockerfile: Dockerfile.24.04
            latest: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 builds run through QEMU on an amd64 runner. For our image
      # (LXQt + Firefox + full apt install) that adds real time; if it
      # ever hurts, split by (variant, platform) onto native ubuntu-24.04
      # + ubuntu-24.04-arm runners and merge digests into a manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ matrix.variant }}
          LATEST: ${{ matrix.latest }}
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMG}:${VERSION}"
            if [ "${LATEST}" = "true" ]; then
              echo "${IMG}:latest"
            fi
            if [ -n "${EXTRA_TAG}" ]; then
              echo "${IMG}:${EXTRA_TAG}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # PRs build both arches for verification but do not push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Per-variant cache so the two Ubuntu versions do not evict
          # each other.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: false
